name: Build Android app

# Builds the Capacitor Android app (com.lasttopper.app).
# - Every push/PR to main: debug APK
# - Manual run or tag v*: release AAB + APK (signed when keystore secrets exist)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Build a release AAB/APK"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_HOST: ${{ vars.APP_HOST || 'last-topper-web-test.vercel.app' }}
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://last-topper-web-test.vercel.app' }}
      # Official Google Android sample app ID is the safe default until an
      # approved Last Topper AdMob app exists. Override with a GitHub variable.
      ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
      # ─── APP VERSION ─── bump these two before each release build.
      # APP_VERSION_NAME: what users see (must match the "Version name" you
      # publish in Admin → App update).
      # APP_VERSION_CODE: integer, must increase every release (must match the
      # "Version code" in Admin → App update).
      APP_VERSION_NAME: ${{ vars.APP_VERSION_NAME || '1.0.1' }}
      APP_VERSION_CODE: ${{ vars.APP_VERSION_CODE || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: |
          npm run build
          # The native shell loads the configured site (capacitor.config.ts -> server.url),
          # so webDir only needs to exist with a fallback document.
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!doctype html><meta charset="utf-8"><title>Last Topper</title><body>Loading…</body>' > dist/index.html
          fi

      - name: Add Capacitor Android platform
        run: |
          npx --yes @capacitor/cli@8.5.0 add android
          # The app targets Android 8.0+ (API 26); Capacitor scaffolds 23/24.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/variables.gradle")
          if p.exists():
              s = p.read_text()
              s = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 26", s)
              p.write_text(s)
          PY
          npx --yes @capacitor/cli@8.5.0 sync android

      - name: Set app version
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          name = os.environ["APP_VERSION_NAME"]
          if os.environ.get("GITHUB_REF", "").startswith("refs/tags/v"):
              name = os.environ["GITHUB_REF_NAME"][1:]
          code = os.environ["APP_VERSION_CODE"]
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          s = re.sub(r"versionCode\s+\d+", f"versionCode {code}", s)
          s = re.sub(r'versionName\s+"[^"]*"', f'versionName "{name}"', s)
          p.write_text(s)
          print("versionCode", code, "versionName", name)
          PY
          npx --yes @capacitor/cli@8.5.0 sync android

      - name: Generate app icons + splash from brand logo
        run: |
          # assets/icon.png, icon-foreground/background.png and splash*.png are
          # committed in the repo; this writes every Android density so the app
          # never falls back to the default Capacitor icon.
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0B1020' --iconBackgroundColorDark '#0B1020' --splashBackgroundColor '#0B1020' --splashBackgroundColorDark '#0B1020'
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_last_topper.xml android/app/src/main/res/drawable/
          npx --yes @capacitor/cli@8.5.0 sync android

      - name: Configure native security, App Links, and AdMob
        run: |
          if ! [[ "$ADMOB_ANDROID_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]]; then
            echo "ADMOB_ANDROID_APP_ID is not a valid Android AdMob application ID" >&2
            exit 1
          fi
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/admob.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="admob_app_id" translatable="false">${ADMOB_ANDROID_APP_ID}</string>
          </resources>
          EOF

          MAIN=android/app/src/main/java/com/lasttopper/app/MainActivity.java
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'JAVA'
          package com.lasttopper.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );
              }
          }
          JAVA

          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" <<'PY'
          import sys, re, os
          p = sys.argv[1]
          s = open(p).read()
          app_host = os.environ["APP_HOST"]
          if f'android:host="{app_host}"' not in s:
              filt = f'''
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="{app_host}" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="lasttopper" android:host="app" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="lasttopper" android:host="auth" />
                      </intent-filter>
          '''
              s = s.replace('</activity>', filt + '        </activity>', 1)

          admob_name = 'com.google.android.gms.ads.APPLICATION_ID'
          if admob_name not in s:
              metadata = '''        <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="@string/admob_app_id" />
          '''
              s = s.replace('</application>', metadata + '    </application>', 1)

          for perm in ("android.permission.POST_NOTIFICATIONS", "android.permission.SCHEDULE_EXACT_ALARM"):
              if perm not in s:
                  s = s.replace('</manifest>', f'    <uses-permission android:name="{perm}" />\n</manifest>')
          open(p, 'w').write(s)
          PY

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lasttopper-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Decode signing keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — building an unsigned internal artifact only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "Tagged releases require the stable release-signing secrets." >&2
              exit 1
            fi
          fi

      - name: Configure release signing
        if: steps.keystore.outputs.signed == 'true'
        run: |
          cat >> android/keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          if "signingConfigs" not in s:
              props = '''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              s = props + s
              s = s.replace("android {", """android {
              signingConfigs {
                  release {
                      if (keystoreProperties['storeFile']) {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          """, 1)
              s = s.replace("buildTypes {", """buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
          """, 1)
              open(p, "w").write(s)
          PY

      - name: Build release bundle + APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: cd android && ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Verify signed APK and App Link certificate
        if: steps.keystore.outputs.signed == 'true'
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APK" && test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_DIGEST=$(
            "$APKSIGNER" verify --print-certs "$APK" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]'
          )
          LINK_DIGEST=$(python3 - <<'PY'
          import json
          value = json.load(open('public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0]
          print(value.replace(':', '').upper())
          PY
          )
          if [ -z "$APK_DIGEST" ] || [ "$APK_DIGEST" != "$LINK_DIGEST" ]; then
            echo "assetlinks.json does not match the signed APK certificate." >&2
            echo "APK: $APK_DIGEST" >&2
            echo "assetlinks.json: $LINK_DIGEST" >&2
            exit 1
          fi

      - name: Package public APK and secret-free source archive
        if: steps.keystore.outputs.signed == 'true'
        run: |
          mkdir -p release
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          cp "$APK" release/last-topper.apk
          git archive --format=zip --output=release/last-topper-source.zip HEAD
          sha256sum release/last-topper.apk release/last-topper-source.zip > release/SHA256SUMS.txt

      - name: Upload release build artifacts
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lasttopper-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            release/*

      - name: Publish direct-download release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/last-topper.apk
            release/last-topper-source.zip
            release/SHA256SUMS.txt
