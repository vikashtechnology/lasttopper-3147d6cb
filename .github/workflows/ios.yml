name: Build iOS app (unsigned)

# Produces an unsigned .app that can be signed and archived in Xcode.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ios:
    runs-on: macos-14
    env:
      APP_HOST: ${{ vars.APP_HOST || 'last-topper-web-test.vercel.app' }}
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://last-topper-web-test.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: |
          npm run build
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!doctype html><meta charset="utf-8"><title>Last Topper</title><body>Loading…</body>' > dist/index.html
          fi

      - name: Add Capacitor iOS platform
        run: |
          npx --yes @capacitor/cli@8.5.0 add ios
          npx --yes @capacitor/cli@8.5.0 sync ios
          npx --yes @capacitor/assets@3.0.5 generate --ios --splashBackgroundColor '#0B1020' --splashBackgroundColorDark '#0B1020'
          npx --yes @capacitor/cli@8.5.0 sync ios

      - name: Register deep links
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import plistlib

          info_path = pathlib.Path("ios/App/App/Info.plist")
          with info_path.open("rb") as source:
              info = plistlib.load(source)
          schemes = info.setdefault("CFBundleURLTypes", [])
          if not any("lasttopper" in entry.get("CFBundleURLSchemes", []) for entry in schemes):
              schemes.append({
                  "CFBundleURLName": "com.lasttopper.app",
                  "CFBundleURLSchemes": ["lasttopper"],
              })
          with info_path.open("wb") as destination:
              plistlib.dump(info, destination)

          entitlements = {
              "com.apple.developer.associated-domains": [f"applinks:{os.environ['APP_HOST']}"],
          }
          entitlements_path = pathlib.Path("ios/App/App/App.entitlements")
          with entitlements_path.open("wb") as destination:
              plistlib.dump(entitlements, destination)
          PY

      - name: Build unsigned app
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: lasttopper-ios-unsigned
          path: ios/App/build/Build/Products/Release-iphoneos/*.app
